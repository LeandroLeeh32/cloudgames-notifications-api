apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-functions
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifications-functions
  template:
    metadata:
      labels:
        app: notifications-functions
    spec:
      containers:
        - name: notifications-functions
          image: fiapmicroservicos-notifications-functions:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: FUNCTIONS_WORKER_RUNTIME
              value: dotnet-isolated
            - name: AzureWebJobsStorage
              valueFrom:
                configMapKeyRef:
                  name: notifications-config
                  key: AzureWebJobsStorage
            - name: RabbitMQConnection
              valueFrom:
                secretKeyRef:
                  name: notifications-secret
                  key: RabbitMQConnection
